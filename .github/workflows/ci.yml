name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          bash -n organize.sh
          bash -n tests/test.sh
          bash -n tests/fuzz.sh
          bash -n completions/organize.bash
          bash -n packaging/build-deb.sh

      - name: Python syntax check
        run: python3 -m py_compile tui/organize-tui.py

      - name: ShellCheck
        run: shellcheck --severity=warning organize.sh tests/test.sh tests/fuzz.sh completions/organize.bash packaging/build-deb.sh

      - name: shfmt
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            mvdan/shfmt:v3 \
            -d organize.sh tests/test.sh completions/organize.bash packaging/build-deb.sh

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: bash tests/test.sh

      - name: Run fuzz test
        run: bash tests/fuzz.sh

  test-alpine:
    name: Test (Alpine / BusyBox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests in Alpine
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.20 \
            sh -c "apk add --no-cache bash && bash tests/test.sh"
