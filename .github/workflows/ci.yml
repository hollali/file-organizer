name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax check
        run: |
          bash -n organize.sh
          bash -n tests/test.sh

      - name: ShellCheck
        run: shellcheck --severity=error organize.sh tests/test.sh

  test:
    name: Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: bash tests/test.sh

  test-alpine:
    name: Test (Alpine / BusyBox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests in Alpine
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            alpine:3.20 \
            sh -c "apk add --no-cache bash && bash tests/test.sh"
